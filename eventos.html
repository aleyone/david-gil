      <h1>Próximos encuentros</h1>

          <div class="rc-events-skel-line mid"></div>

        </div>

    </div>
    <p class="rc-events-foot-back">
      <a href="/">← Volver a Reconexión Consciente</a>

  <footer class="rc-events-footer">
    <div class="rc-events-footer-inner">
